# The Flutter template ships -Xmx8G. This machine has 7.7 GB in total and runs several
# agent Chrome windows, so that figure is larger than the free memory and the daemon was
# being killed mid-build ("Gradle build daemon disappeared unexpectedly"). These values
# fit in what is actually free, and R8 completes in them.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# One build at a time: parallel workers each want their own heap on a machine short of it.
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
