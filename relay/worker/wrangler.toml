name = "olivaw-relay"
# The worker itself, not a copy of it under src/. One file, one place.
main = "worker.js"
compatibility_date = "2026-09-01"

# The free plan. Nothing here needs a paid one: a Durable Object sleeps while nobody is
# connected, and the two limits that matter (100k requests/day, with WebSocket messages
# counted at 20:1, and 13,000 GB-s/day of wake time) work out to roughly 37 hours of
# screen streaming a day.
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects are the ones available without a paid plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
